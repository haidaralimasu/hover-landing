<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient></defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<text x="60" y="112" font-size="38" font-weight="600" fill="#ffffff">Where a $1,000 payment can lose value</text>
<text x="60" y="158" font-size="26" fill="#a3a3a3">Illustrative example, not real figures. The axis starts at $900.</text>
<line x1="130" y1="650" x2="1120" y2="650" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
<text x="118" y="657" font-size="26" fill="#a3a3a3" text-anchor="end">$900</text>
<line x1="130" y1="550" x2="1120" y2="550" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
<text x="118" y="557" font-size="26" fill="#a3a3a3" text-anchor="end">$925</text>
<line x1="130" y1="450" x2="1120" y2="450" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
<text x="118" y="457" font-size="26" fill="#a3a3a3" text-anchor="end">$950</text>
<line x1="130" y1="350" x2="1120" y2="350" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
<text x="118" y="357" font-size="26" fill="#a3a3a3" text-anchor="end">$975</text>
<line x1="130" y1="250" x2="1120" y2="250" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
<text x="118" y="257" font-size="26" fill="#a3a3a3" text-anchor="end">$1,000</text>
<line x1="290.0" y1="250" x2="342.5" y2="250" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 7"/>
<line x1="492.5" y1="310" x2="545.0" y2="310" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 7"/>
<line x1="695.0" y1="410" x2="747.5" y2="410" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 7"/>
<line x1="897.5" y1="490" x2="950.0" y2="490" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 7"/>
<rect x="140.0" y="250" width="150" height="400" rx="10" fill="#f2f2f2"/>
<text x="215.0" y="234" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">$1,000</text>
<text x="215.0" y="702" font-size="28" fill="#d4d4d4" text-anchor="middle">You're paid</text>
<rect x="342.5" y="250" width="150" height="60" rx="10" fill="#8a8a8a"/>
<text x="417.5" y="234" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">−$15</text>
<text x="417.5" y="702" font-size="28" fill="#d4d4d4" text-anchor="middle">Fees</text>
<rect x="545.0" y="310" width="150" height="100" rx="10" fill="#8a8a8a"/>
<text x="620.0" y="294" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">−$25</text>
<text x="620.0" y="702" font-size="28" fill="#d4d4d4" text-anchor="middle">Exchange rate</text>
<rect x="747.5" y="410" width="150" height="80" rx="10" fill="#8a8a8a"/>
<text x="822.5" y="394" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">−$20</text>
<text x="822.5" y="702" font-size="28" fill="#d4d4d4" text-anchor="middle">Bank charges</text>
<rect x="950.0" y="490" width="150" height="160" rx="10" fill="#f2f2f2"/>
<text x="1025.0" y="474" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle">$940</text>
<text x="1025.0" y="702" font-size="28" fill="#d4d4d4" text-anchor="middle">You receive</text>
</svg>