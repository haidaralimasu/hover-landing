<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">Comparing final payouts after fees and conversion</title><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f2f5ef" stroke="none"/><text x="64" y="67" fill="#537046" font-size="15" font-weight="500" font-family="Poppins,Arial,sans-serif">HOVER / FIELD NOTES</text><text x="64" y="139" fill="#000" font-size="42" font-weight="600" font-family="Poppins,Arial,sans-serif">What reaches your bank?</text><text x="64" y="184" fill="#6e6e73" font-size="21" font-weight="400" font-family="Poppins,Arial,sans-serif">Same USD 1,000 invoice. Different payment routes.</text><text x="64" y="240" fill="#000" font-size="20" font-weight="500" font-family="Poppins,Arial,sans-serif">Route A</text><rect x="64" y="260" width="950" height="78" rx="16" fill="#d5dfce" stroke="none"/><text x="89" y="310" fill="#000" font-size="32" font-weight="600" font-family="Poppins,Arial,sans-serif">1,470,000</text><text x="64" y="382" fill="#000" font-size="20" font-weight="500" font-family="Poppins,Arial,sans-serif">Route B</text><rect x="64" y="402" width="974" height="78" rx="16" fill="#96f15b" stroke="none"/><text x="89" y="452" fill="#000" font-size="32" font-weight="600" font-family="Poppins,Arial,sans-serif">1,480,000</text><text x="64" y="557" fill="#000" font-size="22" font-weight="500" font-family="Poppins,Arial,sans-serif">Receiving fee + conversion + withdrawal = total cost</text><text x="64" y="609" fill="#6e6e73" font-size="16" font-weight="400" font-family="Poppins,Arial,sans-serif">Illustrative figures in local-currency units. Not a provider quote.</text></svg>