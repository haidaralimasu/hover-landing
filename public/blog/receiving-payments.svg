<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">How a client invoice reaches a local bank</title><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f2f5ef" stroke="none"/><text x="64" y="67" fill="#537046" font-size="15" font-weight="500" font-family="Poppins,Arial,sans-serif">HOVER / FIELD NOTES</text><text x="64" y="139" fill="#000" font-size="42" font-weight="600" font-family="Poppins,Arial,sans-serif">Getting paid across borders</text><rect x="64" y="197" width="300" height="333" rx="22" fill="#151815" stroke="none"/><text x="94" y="245" fill="#b8c3b3" font-size="15" font-weight="500" font-family="Poppins,Arial,sans-serif">CLIENT INVOICE</text><text x="94" y="313" fill="#fff" font-size="25" font-weight="500" font-family="Poppins,Arial,sans-serif">Project complete.</text><text x="94" y="366" fill="#fff" font-size="52" font-weight="600" font-family="Poppins,Arial,sans-serif">$1,000</text><rect x="94" y="426" width="239" height="56" rx="28" fill="#96f15b" stroke="none"/><text x="131" y="461" fill="#000" font-size="20" font-weight="500" font-family="Poppins,Arial,sans-serif">Ready to pay</text><rect x="422" y="202" width="339" height="96" rx="22" fill="#fff" stroke="none"/><text x="447" y="245" fill="#000" font-size="26" font-weight="600" font-family="Poppins,Arial,sans-serif">USD</text><text x="447" y="273" fill="#6e6e73" font-size="16" font-weight="400" font-family="Poppins,Arial,sans-serif">US account details</text><path d="M377 250h31m-9-8 9 8-9 8" stroke="#708167" stroke-width="2" fill="none"/><rect x="422" y="319" width="339" height="96" rx="22" fill="#fff" stroke="none"/><text x="447" y="362" fill="#000" font-size="26" font-weight="600" font-family="Poppins,Arial,sans-serif">EUR</text><text x="447" y="390" fill="#6e6e73" font-size="16" font-weight="400" font-family="Poppins,Arial,sans-serif">European IBAN</text><path d="M377 367h31m-9-8 9 8-9 8" stroke="#708167" stroke-width="2" fill="none"/><rect x="422" y="436" width="339" height="96" rx="22" fill="#fff" stroke="none"/><text x="447" y="479" fill="#000" font-size="26" font-weight="600" font-family="Poppins,Arial,sans-serif">GBP</text><text x="447" y="507" fill="#6e6e73" font-size="16" font-weight="400" font-family="Poppins,Arial,sans-serif">UK account details</text><path d="M377 484h31m-9-8 9 8-9 8" stroke="#708167" stroke-width="2" fill="none"/><rect x="819" y="280" width="317" height="192" rx="22" fill="#fff" stroke="none"/><rect x="846" y="305" width="52" height="52" rx="26" fill="#eafbdc" stroke="none"/><text x="862" y="340" fill="#000" font-size="30" font-weight="400" font-family="Poppins,Arial,sans-serif">↓</text><text x="846" y="392" fill="#000" font-size="25" font-weight="500" font-family="Poppins,Arial,sans-serif">Your local bank</text><text x="846" y="428" fill="#6e6e73" font-size="16" font-weight="400" font-family="Poppins,Arial,sans-serif">Check payout availability</text><path d="M776 376h30m-9-8 9 8-9 8" stroke="#708167" stroke-width="2" fill="none"/><text x="64" y="613" fill="#537046" font-size="16" font-weight="500" font-family="Poppins,Arial,sans-serif">RECEIVE  /  CHECK THE COST  /  WITHDRAW</text></svg>