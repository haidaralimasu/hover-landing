<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">USD EUR and GBP invoice and bank transfer details</title><rect x="0" y="0" width="1200" height="675" rx="0" fill="#f2f5ef" stroke="none"/><text x="64" y="67" fill="#537046" font-size="15" font-weight="500" font-family="Poppins,Arial,sans-serif">HOVER / FIELD NOTES</text><text x="64" y="139" fill="#000" font-size="42" font-weight="600" font-family="Poppins,Arial,sans-serif">Invoice in the right currency</text><text x="64" y="184" fill="#6e6e73" font-size="21" font-weight="400" font-family="Poppins,Arial,sans-serif">Start with the client’s payment route.</text><rect x="64" y="230" width="340" height="306" rx="22" fill="#fff" stroke="none"/><rect x="90" y="256" width="66" height="66" rx="33" fill="#eafbdc" stroke="none"/><text x="108" y="301" fill="#000" font-size="35" font-weight="500" font-family="Poppins,Arial,sans-serif">$</text><text x="90" y="376" fill="#000" font-size="38" font-weight="600" font-family="Poppins,Arial,sans-serif">USD</text><text x="90" y="428" fill="#000" font-size="23" font-weight="500" font-family="Poppins,Arial,sans-serif">ACH or wire</text><text x="90" y="488" fill="#6e6e73" font-size="17" font-weight="400" font-family="Poppins,Arial,sans-serif">Account + routing number</text><rect x="431" y="230" width="340" height="306" rx="22" fill="#fff" stroke="none"/><rect x="457" y="256" width="66" height="66" rx="33" fill="#eafbdc" stroke="none"/><text x="475" y="301" fill="#000" font-size="35" font-weight="500" font-family="Poppins,Arial,sans-serif">€</text><text x="457" y="376" fill="#000" font-size="38" font-weight="600" font-family="Poppins,Arial,sans-serif">EUR</text><text x="457" y="428" fill="#000" font-size="23" font-weight="500" font-family="Poppins,Arial,sans-serif">SEPA</text><text x="457" y="488" fill="#6e6e73" font-size="17" font-weight="400" font-family="Poppins,Arial,sans-serif">IBAN + beneficiary</text><rect x="798" y="230" width="340" height="306" rx="22" fill="#fff" stroke="none"/><rect x="824" y="256" width="66" height="66" rx="33" fill="#eafbdc" stroke="none"/><text x="842" y="301" fill="#000" font-size="35" font-weight="500" font-family="Poppins,Arial,sans-serif">£</text><text x="824" y="376" fill="#000" font-size="38" font-weight="600" font-family="Poppins,Arial,sans-serif">GBP</text><text x="824" y="428" fill="#000" font-size="23" font-weight="500" font-family="Poppins,Arial,sans-serif">UK bank payment</text><text x="824" y="488" fill="#6e6e73" font-size="17" font-weight="400" font-family="Poppins,Arial,sans-serif">Account + sort code</text><text x="64" y="609" fill="#537046" font-size="19" font-weight="500" font-family="Poppins,Arial,sans-serif">Receiving a currency and holding a currency are different things.</text></svg>